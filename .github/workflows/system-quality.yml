name: Offline system quality

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: offline-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      AWS_EC2_METADATA_DISABLED: "true"
      CDK_DISABLE_VERSION_CHECK: "true"
      CDK_DISABLE_CLI_TELEMETRY: "true"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install frozen dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run actual scoped checks and validate all eight dimensions
        uses: KyPython/ai-governance/.github/actions/system-quality@5dcfb5d6d88a26c7a142b459b83df17cc6b2e590
        with:
          definition: .quality/system.json
          output-directory: .quality-results
      - name: Retain scoped evidence including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ai-governance:
    needs: validate
    if: always()
    uses: KyPython/ai-governance/.github/workflows/governance.yml@f055da775fc5aea4e596f2c5f09970b6abd04e33
    with:
      run-quality: false
      prerequisite-result: ${{ needs.validate.result }}
