name: Deploy AWS career sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-career-sandbox
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "723949188045"
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::723949188045:role/BuildlogicCareerSandboxGitHubDeployRole

jobs:
  validate:
    name: Validate without AWS credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm run typecheck && npm test
      - name: Strict synthesis and cdk-nag
        run: npm run synth
      - name: Upload synthesized assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdk-assembly-${{ github.run_id }}
          path: cdk.out/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Human-approved OIDC deployment
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws-career-sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Assume protected deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Record deployment identity and metadata
        run: |
          mkdir -p audit
          aws sts get-caller-identity | tee audit/sts-identity.json
          printf '{"repository":"%s","sha":"%s","actor":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > audit/deployment-metadata.json
      - name: Change-set-backed diff
        run: npx cdk diff --all --change-set=true --strict 2>&1 | tee audit/cdk-diff.txt
      - name: Deploy all stacks
        run: npx cdk deploy --all --require-approval never --strict --outputs-file audit/stack-outputs.json
      - name: Record resulting stacks
        run: |
          aws cloudformation describe-stacks --stack-name BuildlogicPracticeFoundation > audit/foundation-stack.json
          aws cloudformation describe-stacks --stack-name BuildlogicPracticeCompute > audit/compute-stack.json
      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit/
            cdk.out/
          if-no-files-found: warn
          retention-days: 90
